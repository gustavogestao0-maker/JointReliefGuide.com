  function normalize(s) { return s.replace(/\s+/g, ' ').trim(); }

    if (!el || !el.matches || !el.matches('h1,h2,h3,h4,h5,h6,p,button')) return;

    if (nodes.length < 2) return;
    var weights = nodes.map(function(n) { return normalize(n.nodeValue).length || 1; });
    var total = weights.reduce(function(a,b) { return a+b; }, 0);
    var buckets = nodes.map(function() { return ''; });
    var pieces = target.match(/\S+\s*/g) || [target];
    var position = 0;
    pieces.forEach(function(piece) {
      var center = (position + piece.length / 2) / Math.max(1, target.length) * total;
      var sum = 0, index = weights.length - 1;
      for (var i = 0; i < weights.length; i++) { sum += weights[i]; if (center <= sum) { index = i; break; } }
      buckets[index] += piece;
      position += piece.length;
    });
    nodes.forEach(function(n, i) {
      var lead = i === 0 ? (n.nodeValue.match(/^\s*/)[0] || '') : '';
      var tail = i === nodes.length - 1 ? (n.nodeValue.match(/\s*$/)[0] || '') : '';
      n.nodeValue = lead + buckets[i] + tail;
    });
  }

    if (node.parentElement && node.parentElement.closest('script,style,noscript')) return;
    var original = node.nodeValue;
    if (!original || !original.trim()) return;
    var key = normalize(original);
    var translated = exact[key];

      var lead = original.match(/^\s*/)[0];
      var tail = original.match(/\s*$/)[0];
      node.nodeValue = lead + translated + tail;
      return;
    }
    var next = original;
